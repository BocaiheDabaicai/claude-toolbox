[project]
name = "__PROJECT_NAME__"
version = "0.1.0"
description = "FastAPI modular monolith template"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.165.0,<0.166",
  "uvicorn[standard]>=0.54.0,<0.55",
  "sqlalchemy[asyncio]>=2.1.9,<2.2",
  "asyncpg>=0.32.0,<0.33",
  "alembic>=1.20.1,<1.21",
  "pydantic>=2.14.4,<3",
  "pydantic-settings>=2.16.3,<3",
  "pyjwt>=2.15.1,<3",
  "pwdlib[argon2]>=0.4.2,<0.5",
  "email-validator>=2.2.0,<3",
]

[dependency-groups]
dev = [
  "pytest>=9.2.0",
  "pytest-asyncio>=1.5.0",
  "httpx>=0.28.1",
  "ruff>=0.17.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends/Query in defaults is idiomatic
