[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opsctl"
version = "0.1.0"
description = "Unified lifecycle manager for multiple projects on a single Linux server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Personal toolbox" }]
dependencies = []

[project.scripts]
opsctl = "opsctl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opsctl"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
